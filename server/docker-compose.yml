name: helium-home-sync

services:
  helium-home-sync:
    build: .
    image: helium-home-sync
    restart: unless-stopped
    environment:
      SYNC_TOKEN: ${SYNC_TOKEN:?Set SYNC_TOKEN in server/.env}
      STATUS_TOKEN: ${STATUS_TOKEN:-}
      LIMIT_DISK: ${LIMIT_DISK:-}
      LIMIT_MEMORY: ${LIMIT_MEMORY:-}
      LIMIT_SWAP: ${LIMIT_SWAP:-}
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - helium-home-sync-data:/data
      - /etc/localtime:/etc/localtime:ro

volumes:
  helium-home-sync-data:
